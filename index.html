<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player and Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #3498db;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #2980b9;
            color: white;
            padding: 10px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
        }

        #mp3File {
            display: none;
        }

        #customButton {
            border-radius: 100%;
            color: #2980b9;
            font-size: 50px;
            cursor: pointer;
            margin-top: 10px;
            align-items: center;
        }

        #uploadButtonContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px; /* Adjust the margin as needed */
        }

        #audioPlayer {
            display: none;
            width: 100%;
            margin-top: 60px;
        }

        #playerControls {
            display: none;
            justify-content: center;
            margin-top: 10px;
        }

        .controlButton {
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 10px;
            padding: 10px;
            cursor: pointer;
        }

        #uploadButtonNavbar,
        #volumeControl {
            display: none;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
            padding: 10px;
            cursor: pointer;
        }

        #pageTitle {
            font-size: 50px;
            text-align: center;
            margin: 0;
            flex-grow: 1;
        }

        #fileTitle {
            font-size: 18px;
            margin-top: 10px;
            text-align: center;
        }

        #recentSongs {
            margin-top: 20px;
            text-align: center;
        }

        #recentSongsContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        main {
            margin-top: 60px;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
        }

        #musicList {
            list-style: none;
            padding: 0;
            text-align: center;
        }

        .song {
            display: flex;
            align-items: center;
            margin: 10px;
        }

        .playButton {
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <h1 id="pageTitle">Music</h1>
        <button id="uploadButtonNavbar" onclick="uploadFile()">
            <i class="fa-solid fa-cloud-upload" style="font-size: 50px;"></i>
        </button>
    </nav>

    <main>
        <div id="uploadButtonContainer">
            <label for="mp3File" id="customButton">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </label>
        </div>

        <input type="file" id="mp3File" accept=".mp3">

        <audio controls loop id="audioPlayer">
            Your browser does not support the audio element.
        </audio>

        <div id="playerControls">
            <button class="controlButton" onclick="skipSeconds(-5)">
                <i class="fa-solid fa-backward"></i> Skip Backward
            </button>
            <button class="controlButton" onclick="togglePlayPause()">
                <i id="playPauseIcon" class="fa-solid fa-pause"></i> Play/Pause
            </button>
            <button class="controlButton" onclick="skipSeconds(5)">
                Skip Forward <i class="fa-solid fa-forward"></i>
            </button>
            <input type="range" id="volumeControl" value="100" onchange="adjustVolume()">
        </div>

        <div id="fileTitle"></div>

        <div id="recentSongs">
            <h2>Recently Played</h2>
            <div id="recentSongsContainer">
                <ul id="musicList"></ul>
            </div>
        </div>
    </main>

    <script>
        const recentSongsList = document.getElementById('musicList');

        function addToRecentSongs(title, url) {
            const listItem = document.createElement('li');
            listItem.className = 'song';
            listItem.innerHTML = `<p>${title}</p>`;
            listItem.appendChild(createPlayButton(title, url));
            recentSongsList.appendChild(listItem);
        }

        document.getElementById('mp3File').addEventListener('change', function () {
            var audioPlayer = document.getElementById('audioPlayer');
            var fileInput = document.getElementById('mp3File');
            var customButton = document.getElementById('customButton');
            var playerControls = document.getElementById('playerControls');
            var volumeControl = document.getElementById('volumeControl');
            var uploadButtonNavbar = document.getElementById('uploadButtonNavbar');
            var fileTitle = document.getElementById('fileTitle');

            var file = fileInput.files[0];
            var objectURL = URL.createObjectURL(file);

            audioPlayer.src = objectURL;
            audioPlayer.load();
            audioPlayer.play();

            customButton.style.display = 'none';
            audioPlayer.style.display = 'block';
            playerControls.style.display = 'flex';
            volumeControl.style.display = 'block';
            uploadButtonNavbar.style.display = 'block';
            fileTitle.innerText = 'Now playing: ' + file.name;

            addToRecentSongs(file.name, objectURL);
        });

        function skipSeconds(seconds) {
            var audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.currentTime += seconds;
        }

        function togglePlayPause() {
            var audioPlayer = document.getElementById('audioPlayer');
            var playPauseIcon = document.getElementById('playPauseIcon');

            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseIcon.classList.remove('fa-play');
                playPauseIcon.classList.add('fa-pause');
            } else {
                audioPlayer.pause();
                playPauseIcon.classList.remove('fa-pause');
                playPauseIcon.classList.add('fa-play');
            }
        }

        function adjustVolume() {
            var audioPlayer = document.getElementById('audioPlayer');
            var volumeControl = document.getElementById('volumeControl');
            audioPlayer.volume = volumeControl.value / 100;
        }

        function uploadFile() {
            // Clear the current song and allow the user to upload a new one
            var audioPlayer = document.getElementById('audioPlayer');
            var customButton = document.getElementById('customButton');
            var playerControls = document.getElementById('playerControls');
            var volumeControl = document.getElementById('volumeControl');
            var uploadButtonNavbar = document.getElementById('uploadButtonNavbar');
            var fileTitle = document.getElementById('fileTitle');

            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            audioPlayer.style.display = 'none';
            playerControls.style.display = 'none';
            volumeControl.style.display = 'none';
            uploadButtonNavbar.style.display = 'none';
            customButton.style.display = 'block';
            fileTitle.innerText = '';

            // Allow the user to upload a new song
            document.getElementById('mp3File').value = '';
        }

        function createPlayButton(title, url) {
            const playButton = document.createElement('span');
            playButton.innerHTML = '▶️';
            playButton.className = 'playButton';
            playButton.addEventListener('click', () => playRecentSong(title, url));
            return playButton;
        }

        function playRecentSong(title, url) {
            var audioPlayer = document.getElementById('audioPlayer');
            var playPauseIcon = document.getElementById('playPauseIcon');

            audioPlayer.src = url;
            audioPlayer.load();
            audioPlayer.play();

            var fileTitle = document.getElementById('fileTitle');
            fileTitle.innerText = 'Now playing: ' + title;

            playPauseIcon.classList.remove('fa-play');
            playPauseIcon.classList.add('fa-pause');
        }
    </script>

<div id="playerControls">
    <button class="controlButton" onclick="skipSeconds(-5)">
        <i class="fa-solid fa-backward"></i> Skip Backward
    </button>
    <button class="controlButton" onclick="togglePlayPause()">
        <i id="playPauseIcon" class="fa-solid fa-pause"></i> Play/Pause
    </button>
    <button class="controlButton" onclick="skipSeconds(5)">
        Skip Forward <i class="fa-solid fa-forward"></i>
    </button>
    <button class="controlButton" onclick="toggleLoop()" id="loopButton">
        <i class="fa-solid fa-repeat"></i> Loop
    </button>
    <input type="range" id="volumeControl" value="100" onchange="adjustVolume()">
</div>


}


</body>

</html>
